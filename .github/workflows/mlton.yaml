name: MLton

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MLton
        run: |
          sudo apt-get update
          sudo apt-get install -y mlton

      - name: Build
        run: |
          mlton -output ./build/june ./src/june.mlb

      # Optional: run tests if your project builds an executable
      # - name: Run tests
      #   run: |
      #     ./src/june